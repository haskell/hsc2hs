name: build
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.10', '9.12', '9.14']
        os: [ubuntu-latest, macOS-latest, windows-latest]
        include:
          # Fails with GHC 8.0
          # - os: ubuntu-latest
          #   ghc: '8.0'
          - os: ubuntu-latest
            ghc: '8.2'
          - os: ubuntu-latest
            ghc: '8.4'
          - os: ubuntu-latest
            ghc: '8.6'
          - os: ubuntu-latest
            ghc: '8.8'
          - os: ubuntu-latest
            ghc: '8.10'
          - os: ubuntu-latest
            ghc: '9.0'
          - os: ubuntu-latest
            ghc: '9.2'
          - os: ubuntu-latest
            ghc: '9.4'
          - os: ubuntu-latest
            ghc: '9.6'
          - os: ubuntu-latest
            ghc: '9.8'
    name: "${{ matrix.os }} - ${{ matrix.ghc }}"
    steps:
      - uses: actions/checkout@v6
      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
          cabal-update: false
      - run: cabal check
      - run: cabal update
      - run: cabal build
      - run: cabal build --enable-tests
      - run: cabal test --test-show-details=direct --verbose
